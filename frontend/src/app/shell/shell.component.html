<p-sidebar-layout class="flex h-screen mx-auto w-full min-w-[425] max-w-[1280px]">
    @if (contexte.foyerId()) {
        @if (viewport.estCompact() && contexte.sidebarOuverte()) {
            <p-sidebar-backdrop />
        }
        <app-sidebar-menu />
    }
    <p-sidebar-main class="flex flex-col flex-1 overflow-hidden">
        <app-topbar class="sticky top-0 z-10" />
        <main class="flex-1 overflow-y-auto p-4 md:p-6">
            <router-outlet />
        </main>
    </p-sidebar-main>
</p-sidebar-layout>
