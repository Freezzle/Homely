<p-confirmdialog />
<div class="flex flex-col gap-4">
  <div class="flex items-center gap-4">
    <h1 class="text-2xl font-bold flex-1">{{ t.referentiels.taux.titre }}</h1>
    <app-tag [texte]="t.foyer.deviseBase + ' : ' + contexte.deviseBase()" severity="info" />
    @if (contexte.estEditor()) {
      <app-button icon="pi pi-plus" [label]="t.commun.creer" (clickEvent)="ouvrirCreation()" />
    }
  </div>

  <!-- Tableau dense : le scroll horizontal est confiné au conteneur (jamais la page) et
       la colonne de libellé reste visible. Voir styles/_tableaux.css. -->
  <div class="table-scroll">
  <p-table [value]="taux()" class="p-datatable-sm p-datatable-striped table-sticky-1" [loading]="chargement()">
    <ng-template #header>
      <tr>
        <th>{{ t.referentiels.taux.devise }}</th>
        <th class="text-right">{{ t.referentiels.taux.tauxVersBase }}</th>
        <th></th>
      </tr>
    </ng-template>
    <ng-template #body let-tx>
      <tr>
        <td class="font-medium">{{ tx.devise }}</td>
        <td class="text-right">{{ tx.tauxVersBase }}</td>
        <td>
          <div class="flex gap-1">
            @if (contexte.estEditor()) {
              <app-button icon="pi pi-pencil" [text]="true" size="small" (clickEvent)="ouvrirEdition(tx)" />
              <app-button icon="pi pi-trash" [text]="true" severity="danger" size="small" (clickEvent)="supprimer(tx)" />
            }
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr><td colspan="3" class="text-center py-8 text-surface-400">{{ t.commun.aucunResultat }}</td></tr>
    </ng-template>
  </p-table>
  </div>
</div>

<app-taux-form-dialog
  [visible]="dialogVisible"
  [taux]="tauxEnEdition"
  (visibleChange)="dialogVisible = $event"
  (enregistrer)="enregistrer($event)" />
