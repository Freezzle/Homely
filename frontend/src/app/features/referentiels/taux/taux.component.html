<p-confirmdialog />
<div class="flex flex-col gap-4">
  <div class="flex items-center gap-4">
    <h1 class="text-2xl font-bold flex-1">{{ t.referentiels.taux.titre }}</h1>
    <app-tag [texte]="t.foyer.deviseBase + ' : ' + contexte.deviseBase()" severity="info" />
    @if (contexte.estEditor()) {
      <app-button icon="pi pi-plus" [label]="t.commun.creer" (clickEvent)="ouvrirCreation()" />
    }
  </div>

  <p-table [value]="taux()" class="p-datatable-sm p-datatable-striped" [loading]="chargement()">
    <ng-template #header>
      <tr>
        <th>{{ t.referentiels.taux.devise }}</th>
        <th class="text-right">{{ t.referentiels.taux.tauxVersBase }}</th>
        <th></th>
      </tr>
    </ng-template>
    <ng-template #body let-tx>
      <tr>
        <td class="font-medium">{{ tx.devise }}</td>
        <td class="text-right">{{ tx.tauxVersBase }}</td>
        <td>
          <div class="flex gap-1">
            @if (contexte.estEditor()) {
              <app-button icon="pi pi-pencil" [text]="true" size="small" (clickEvent)="ouvrirEdition(tx)" />
              <app-button icon="pi pi-trash" [text]="true" severity="danger" size="small" (clickEvent)="supprimer(tx)" />
            }
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr><td colspan="3" class="text-center py-8 text-surface-400">{{ t.commun.aucunResultat }}</td></tr>
    </ng-template>
  </p-table>
</div>

<p-dialog [(visible)]="dialogVisible" [header]="tauxEnEdition ? t.commun.modifier : t.commun.creer"
          [modal]="true" class="w-full max-w-sm">
  <form [formGroup]="form" class="flex flex-col pt-2">
    <app-input-text
      [label]="t.referentiels.taux.devise"
      formControlName="devise"
      [required]="true"
      [readonly]="!!tauxEnEdition" />
    <app-input-number
      [label]="t.referentiels.taux.tauxVersBase"
      formControlName="tauxVersBase"
      [required]="true"
      mode="decimal"
      [minFractionDigits]="6"
      [maxFractionDigits]="6"
      [min]="0.000001"
      [hint]="form.get('tauxVersBase')?.disabled ? t.referentiels.taux.tauxDeviseBaseVerrouille : egaliteTauxVersBase()" />
  </form>
  <ng-template #footer>
    <app-button [label]="t.commun.annuler" severity="secondary" (clickEvent)="dialogVisible = false" />
    <app-button [label]="t.commun.enregistrer" (clickEvent)="enregistrer()" [disabled]="form.invalid" />
  </ng-template>
</p-dialog>
