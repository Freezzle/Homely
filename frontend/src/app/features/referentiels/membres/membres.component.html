<p-confirmdialog />
<div class="flex flex-col gap-4">
  <div class="flex items-center gap-4">
    <h1 class="text-2xl font-bold flex-1">{{ t.referentiels.membre.titre }}</h1>
    @if (contexte.estEditor()) {
      <app-button icon="pi pi-plus" [label]="t.commun.creer" (clickEvent)="ouvrirCreation()" />
    }
  </div>

  <!-- Tableau dense : le scroll horizontal est confiné au conteneur (jamais la page) et
       la colonne de libellé reste visible. Voir styles/_tableaux.css. -->
  <div class="table-scroll">
  <p-table [value]="membres()" class="p-datatable-sm p-datatable-striped table-sticky-1" [loading]="chargement()">
    <ng-template #header>
      <tr>
        <th>{{ t.referentiels.membre.couleur }}</th>
        <th pSortableColumn="nom">{{ t.referentiels.membre.nom }} <p-sort-icon field="nom" /></th>
        <th class="text-center">{{ t.referentiels.membre.actif }}</th>
        <th></th>
      </tr>
    </ng-template>
    <ng-template #body let-m>
      <tr>
        <td>
          <span class="inline-block w-5 h-5 rounded-full border border-surface-300"
                [style.background-color]="m.couleur"></span>
        </td>
        <td class="font-medium">{{ m.nom }}</td>
        <td class="text-center">
          <i [class]="m.actif ? 'pi pi-check texte-succes' : 'pi pi-times text-surface-300'"></i>
        </td>
        <td>
          <div class="flex gap-1">
            @if (contexte.estEditor()) {
              <app-button icon="pi pi-pencil" [text]="true" size="small" (clickEvent)="ouvrirEdition(m)" />
              <app-button icon="pi pi-trash" [text]="true" severity="danger" size="small" (clickEvent)="supprimer(m)" />
            }
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr><td colspan="4" class="text-center py-8 text-surface-400">{{ t.commun.aucunResultat }}</td></tr>
    </ng-template>
  </p-table>
  </div>
</div>

<app-membre-form-dialog
  [visible]="dialogVisible"
  [membre]="membreEnEdition"
  (visibleChange)="dialogVisible = $event"
  (enregistrer)="enregistrer($event)" />
