<div class="flex flex-col gap-4">
  @if (facade.comptesIndicators().length) {
    <div class="grid grid-cols-1 gap-4 w-full">
      @for (item of facade.comptesIndicators(); track item.indicator.key) {
        <app-carte-indicateur [indicator]="item.indicator" (detailsClick)="openIndicator(item)" />
      }
    </div>
  }
</div>
