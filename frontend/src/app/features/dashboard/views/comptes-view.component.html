<div class="flex flex-col gap-4">
  @if (facade.afficherOngletComptes()) {
    <app-carte-info
      [titre]="facade.t.dashboard.virementsComptesTitre"
      [sousTitre]="facade.t.dashboard.virementsComptesSousTitre">
      <app-table-virements-comptes
        [virements]="facade.virementsComptesCourant()"
        [comptes]="facade.comptes()"
        [membres]="facade.membres()"
        [virementsFaits]="facade.virementsComptesFaits()"
        [membreActuelId]="facade.membreActuelId()"
        [devise]="facade.deviseBase()"
        [chargement]="facade.virementsComptesCourantChargement()"
        (virementBascule)="onVirementBascule($event)" />
    </app-carte-info>
  }

  @if (facade.comptesIndicators().length) {
    <app-dashboard-section
      [title]="facade.dashboardViewLabel('comptes')"
      [count]="facade.comptesIndicators().length"
      countColor="info">
      @for (item of facade.comptesIndicators(); track item.indicator.key) {
        <app-indicator-card
          [icon]="item.indicator.icon"
          [iconColor]="item.indicator.iconColor"
          [title]="item.indicator.title"
          [subtitle]="item.indicator.subtitle ?? ''"
          [info]="item.indicator.info ?? ''"
          [infoColor]="item.indicator.infoColor ?? null"
          [infoSubtitle]="item.indicator.infoSubtitle ?? ''"
          [tags]="item.indicator.tags"
          (cardClick)="openIndicator(item)" />
      }
    </app-dashboard-section>
  }
</div>
