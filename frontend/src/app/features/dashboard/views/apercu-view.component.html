<div class="flex flex-col gap-4">
  @if (facade.vue() === 'mois') {
    <!-- Vue mensuelle : pas de graphique de flux (une série de 12 mois n'a pas de sens sur
         un mois isolé) ; la répartition du mois et la comparaison partagent la ligne. -->
    <div class="grid grid-cols-1 gap-4 lg:grid-cols-2">
      <app-carte-info
        [titre]="facade.t.dashboard.repartitionMoisTitre"
        [sousTitre]="facade.t.dashboard.repartitionMoisSousTitre">
        <app-indicateur-entonnoir [etapes]="facade.entonnoirRepartitionMois()" />
      </app-carte-info>

      <app-carte-info
        [titre]="facade.t.dashboard.comparaisonPeriodeTitre"
        [sousTitre]="facade.t.dashboard.comparaisonPeriodeSousTitre">
        <app-indicateur-comparaison
          [libelleColonne]="facade.t.dashboard.comparaisonPeriodeColonne"
          [libellePrecedent]="facade.comparaisonPeriode().libellePrecedent"
          [libelleActuel]="facade.comparaisonPeriode().libelleActuel"
          [elements]="facade.comparaisonPeriode().elements" />
      </app-carte-info>
    </div>
  } @else {
    <!-- Vue annuelle : le flux 12 mois occupe toute la ligne, la répartition de l'année et
         la comparaison de période se partagent la suivante. -->
    <app-carte-info
      [titre]="facade.t.dashboard.fluxMensuel"
      [sousTitre]="facade.t.dashboard.fluxMensuelSousTitre">
      <app-indicateur-barres-ligne
        [segments]="facade.fluxBarresLigne().segments"
        [ligne]="facade.fluxBarresLigne().ligne"
        [libelles]="facade.fluxBarresLigne().libelles"
        [libellesComplets]="facade.fluxBarresLigne().libellesComplets"
        [formateurValeur]="facade.fluxBarresLigne().formateurValeur"
        [formateurInfobulle]="facade.fluxBarresLigne().formateurInfobulle"
        hauteur="220px" />
    </app-carte-info>

    <div class="grid grid-cols-1 gap-4 lg:grid-cols-2">
      <app-carte-info
        [titre]="facade.t.dashboard.repartitionAnneeTitre"
        [sousTitre]="facade.t.dashboard.repartitionAnneeSousTitre">
        <app-indicateur-entonnoir [etapes]="facade.entonnoirRepartitionAnnee()" />
      </app-carte-info>

      <app-carte-info
        [titre]="facade.t.dashboard.comparaisonPeriodeTitre"
        [sousTitre]="facade.t.dashboard.comparaisonPeriodeSousTitre">
        <app-indicateur-comparaison
          [libelleColonne]="facade.t.dashboard.comparaisonPeriodeColonne"
          [libellePrecedent]="facade.comparaisonPeriode().libellePrecedent"
          [libelleActuel]="facade.comparaisonPeriode().libelleActuel"
          [elements]="facade.comparaisonPeriode().elements" />
      </app-carte-info>
    </div>
  }

    <div class="grid grid-cols-1 gap-4 lg:grid-cols-2">
    @for (item of facade.apercuIndicators(); track item.indicator.key) {
      <app-carte-indicateur [indicator]="item.indicator" (detailsClick)="openIndicator(item)" />
    }
  </div>
</div>
