<div class="flex flex-col gap-4">
  <p-card>
    <div class="flex flex-col gap-3">
      <div>
        <h2 class="m-0 text-sm font-semibold uppercase tracking-[0.08em] text-surface-500">{{ facade.t.dashboard.fluxMensuel }}</h2>
      </div>
      <div class="relative flex h-56 w-full overflow-hidden sm:h-64 md:h-[280px]">
        <p-chart type="bar" [data]="$any(fluxMensuelChartData())" [options]="$any(fluxMensuelChartOptions)" class="block w-full" />
      </div>
    </div>
  </p-card>

  @if (facade.vue() === 'mois') {
    <p-card>
      <hly-amount-bar-list
        [items]="facade.amountBarItems()"
        [reference]="facade.agregatMoisCourant().revenus"
        [devise]="facade.deviseBase()" />
    </p-card>
  }

  <app-dashboard-section
    [title]="facade.dashboardViewLabel('apercu')"
    [count]="facade.apercuIndicators().length"
    countColor="info">
    @for (item of facade.apercuIndicators(); track item.indicator.key) {
      <app-indicator-card
        [icon]="item.indicator.icon"
        [iconColor]="item.indicator.iconColor"
        [title]="item.indicator.title"
        [subtitle]="item.indicator.subtitle ?? ''"
        [info]="item.indicator.info ?? ''"
        [infoColor]="item.indicator.infoColor ?? null"
        [infoSubtitle]="item.indicator.infoSubtitle ?? ''"
        [tags]="item.indicator.tags"
        (cardClick)="openIndicator(item)" />
    }
  </app-dashboard-section>
</div>
