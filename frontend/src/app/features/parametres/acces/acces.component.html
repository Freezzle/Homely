<p-confirmdialog />
<div class="flex flex-col gap-4">
  <div class="flex items-center gap-4">
    <h1 class="text-2xl font-bold flex-1">{{ t.acces.titre }}</h1>
    @if (contexte.estOwner()) {
      <app-button icon="pi pi-user-plus" [label]="t.acces.inviter" (clickEvent)="ouvrirInvitation()" />
    }
  </div>

  <p-table [value]="acces()" class="p-datatable-sm p-datatable-striped" [loading]="chargement()">
     <ng-template #header>
       <tr>
         <th>{{ t.commun.nom }}</th>
         <th>{{ t.acces.email }}</th>
         <th>{{ t.acces.role }}</th>
         <th></th>
       </tr>
     </ng-template>
     <ng-template #body let-a>
       <tr>
         <td class="font-medium">{{ a.nomComplet }}</td>
         <td class="text-surface-500">{{ a.email }}</td>
         <td>
           <app-tag [texte]="roleLabel(a.role)"
                    [severity]="a.role === 'OWNER' ? 'warn' : a.role === 'EDITOR' ? 'info' : 'secondary'" />
         </td>
         <td>
           <div class="flex gap-1">
             @if (contexte.estOwner() && a.role !== 'OWNER') {
               <app-button icon="pi pi-cog" [text]="true" size="small"
                           [tooltip]="t.acces.changerRole" (clickEvent)="ouvrirChangerRole(a)" />
               <app-button icon="pi pi-user-minus" [text]="true" severity="danger" size="small"
                           [tooltip]="t.acces.retirer" (clickEvent)="retirer(a)" />
             }
           </div>
         </td>
       </tr>
     </ng-template>
     <ng-template #emptymessage>
       <tr><td colspan="4" class="text-center py-8 text-surface-400">{{ t.commun.aucunResultat }}</td></tr>
     </ng-template>
   </p-table>
</div>

<!-- Dialog invitation -->
<p-dialog [(visible)]="inviteVisible" [header]="t.acces.inviter" [modal]="true" class="w-full max-w-md">
  <form [formGroup]="inviteForm" class="flex flex-col pt-2">
    <app-input-text
      [label]="t.acces.email"
      [required]="true"
      type="email"
      formControlName="email"
      class="w-full" />
    <app-select
      [label]="t.acces.role"
      formControlName="role"
      [options]="roleOptions"
      optionLabel="label"
      optionValue="value"
      class="w-full" />
  </form>
  <ng-template #footer>
    <app-button [label]="t.commun.annuler" severity="secondary" (clickEvent)="inviteVisible = false" />
    <app-button [label]="t.acces.inviter" (clickEvent)="inviter()" [disabled]="inviteForm.invalid || enCours()" [loading]="enCours()" />
  </ng-template>
</p-dialog>

<!-- Dialog changer rôle -->
<p-dialog [(visible)]="roleVisible" [header]="t.acces.changerRole" [modal]="true" class="w-full max-w-sm">
  <div class="flex flex-col gap-4 pt-2">
    <app-select
      [(ngModel)]="nouveauRole"
      [options]="roleOptions"
      optionLabel="label"
      optionValue="value"
      class="w-full" />
  </div>
  <ng-template #footer>
    <app-button [label]="t.commun.annuler" severity="secondary" (clickEvent)="roleVisible = false" />
    <app-button [label]="t.commun.enregistrer" (clickEvent)="changerRole()" [disabled]="enCours()" [loading]="enCours()" />
  </ng-template>
</p-dialog>
