<p-confirmdialog />
<div class="flex flex-col gap-6">
  <h1 class="text-2xl font-bold">{{ t.parametres.titre }}</h1>

  <p-card>
    <form [formGroup]="form" class="flex flex-col">
      <app-input-text
        [label]="t.parametres.nom"
        [required]="true"
        formControlName="nom"
        class="w-full" />
      <app-select
        [label]="t.parametres.deviseBase"
        formControlName="deviseBase"
        [options]="devises"
        class="w-full" />
      <div class="flex justify-end">
        <app-button [label]="t.parametres.enregistrer" icon="pi pi-save"
                    (clickEvent)="enregistrer()" [disabled]="form.invalid || !contexte.estOwner()"
                    [loading]="sauvegarde()" />
      </div>
    </form>
  </p-card>

  @if (contexte.estOwner()) {
    <p-card class="border border-red-200">
      <div class="flex items-center justify-between">
        <div>
          <div class="font-semibold text-red-600">{{ t.parametres.zoneDangereuse }}</div>
          <div class="text-sm text-surface-500 mt-1">{{ t.parametres.confirmerSuppression }}</div>
        </div>
        <app-button [label]="t.parametres.supprimer" icon="pi pi-trash" severity="danger"
                    (clickEvent)="supprimerFoyer()" />
      </div>
    </p-card>
  }
</div>
