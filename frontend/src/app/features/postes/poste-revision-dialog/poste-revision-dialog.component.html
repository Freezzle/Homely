<p-dialog [visible]="visible()" (visibleChange)="visibleChange.emit($event)"
          [header]="i18n.instant('poste.revisionTitre', { description: poste()?.description ?? '' })"
          [modal]="true" class="w-full max-w-md">
    @if (poste(); as p) {
        <form [formGroup]="form" class="flex flex-col gap-4 pt-2">
            <div class="flex flex-col gap-1">
                <label class="text-sm font-medium text-surface-500">{{ t.poste.revisionMontantActuel }}</label>
                <span class="text-sm">{{ p.montant | montant:p.devise }}</span>
            </div>

            <div>
                <app-input-number
                    [label]="t.poste.revisionNouveauMontant"
                    [required]="true"
                    formControlName="nouveauMontant"
                    mode="decimal"
                    [minFractionDigits]="2"/>
                @if (montantIdentique()) {
                    <span class="text-xs text-red-600 dark:text-red-400">{{ t.poste.revisionMontantIdentique }}</span>
                }
            </div>

            <app-date-picker
                [label]="t.poste.revisionDateEffet"
                [required]="true"
                formControlName="dateEffet"
                view="month"
                dateFormat="mm/yy"
                [minDate]="dateMin()"
                [maxDate]="dateMax()"
                [showButtonBar]="true"/>

            <div class="text-sm rounded-md border border-primary/30 bg-primary/5 px-3 py-2 text-primary-700 dark:text-primary-300">
                {{ resume() }}
            </div>
        </form>
    }
    <ng-template #footer>
        <app-button [label]="t.commun.annuler" severity="secondary" (click)="fermer()"/>
        <app-button [label]="t.commun.enregistrer" (click)="enregistrer()"
                    [disabled]="!valide() || enregistrementEnCours" [loading]="enregistrementEnCours"/>
    </ng-template>
</p-dialog>
