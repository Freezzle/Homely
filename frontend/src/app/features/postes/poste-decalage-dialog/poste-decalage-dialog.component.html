<p-dialog [visible]="visible()" (visibleChange)="visibleChange.emit($event)"
          [header]="i18n.instant('poste.decalerDateEffetTitre', { description: poste()?.description ?? '' })"
          [modal]="true" class="w-full max-w-md">
    @if (poste() && precedent()) {
        <form [formGroup]="form" class="flex flex-col gap-4 pt-2">
            @if (intervalleVide()) {
                <p class="text-sm text-red-600 dark:text-red-400">{{ t.poste.decalerDateEffetAucunMoisDisponible }}</p>
            } @else {
                <app-date-picker
                    [label]="t.poste.decalerDateEffetLabel"
                    [required]="true"
                    formControlName="nouvelleDateEffet"
                    view="month"
                    dateFormat="mm/yy"
                    [minDate]="borneMin()"
                    [maxDate]="borneMax()"
                    [showButtonBar]="true"/>

                <div class="text-sm rounded-md border border-primary/30 bg-primary/5 px-3 py-2 text-primary-700 dark:text-primary-300">
                    {{ resume() }}
                </div>
            }
        </form>
    }
    <ng-template #footer>
        <app-button [label]="t.commun.annuler" severity="secondary" (clickEvent)="fermer()"/>
        <app-button [label]="t.commun.enregistrer" (clickEvent)="enregistrer()"
                    [disabled]="!valide() || enregistrementEnCours" [loading]="enregistrementEnCours"/>
    </ng-template>
</p-dialog>
