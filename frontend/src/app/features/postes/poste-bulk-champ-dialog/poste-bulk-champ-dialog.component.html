<p-dialog [visible]="visible()" (visibleChange)="visibleChange.emit($event)"
          [header]="titre()"
          [modal]="true" class="w-full max-w-md">

    @switch (champ()) {
        @case ('CATEGORIE') {
            <div class="flex flex-col gap-2 pt-2">
                <label class="text-sm font-medium">{{ t.poste.categorie }}</label>
                <p-select appendTo="body"
                          [(ngModel)]="valeurCategorieId"
                          [options]="categories()"
                          optionLabel="libelle" optionValue="id"
                          [showClear]="true"
                          class="w-full"/>
            </div>
        }
        @case ('IMPORTANCE') {
            <div class="flex flex-col gap-2 pt-2">
                <label class="text-sm font-medium flex items-center justify-between">
                    <span>{{ t.poste.importance }}</span>
                    <span class="text-xs text-surface-500">{{ valeurImportance }} / 5</span>
                </label>
                <div class="w-[95%] mx-auto flex flex-col gap-1">
                    <p-slider [(ngModel)]="valeurImportance" [min]="1" [max]="5" [step]="1"/>
                    <div class="flex justify-between text-[10px] text-surface-400">
                        <span>{{ t.poste.importanceMin }}</span>
                        <span>{{ t.poste.importanceMax }}</span>
                    </div>
                </div>
            </div>
        }
        @case ('POTENTIEL_OPTIMISATION') {
            <div class="flex flex-col gap-2 pt-2">
                <label class="text-sm font-medium flex items-center justify-between">
                    <span>{{ t.poste.potentielOptimisation }}</span>
                    <span class="text-xs text-surface-500">{{ valeurPotentiel }} / 5</span>
                </label>
                <div class="w-[95%] mx-auto flex flex-col gap-1">
                    <p-slider [(ngModel)]="valeurPotentiel" [min]="1" [max]="5" [step]="1"/>
                    <div class="flex justify-between text-[10px] text-surface-400">
                        <span>{{ t.poste.potentielOptimisationMin }}</span>
                        <span>{{ t.poste.potentielOptimisationMax }}</span>
                    </div>
                </div>
            </div>
        }
    }

    <ng-template #footer>
        <p-button [label]="t.commun.annuler" severity="secondary" (click)="fermer()"/>
        <p-button [label]="t.poste.bulk.appliquer" (click)="appliquer()"
                  [loading]="enregistrementEnCours"/>
    </ng-template>
</p-dialog>
