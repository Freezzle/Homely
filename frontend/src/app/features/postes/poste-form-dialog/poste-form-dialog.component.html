<app-parcours-guide
    [visible]="visible()"
    [titre]="modeEdition() ? t.poste.form.titreEdition : t.poste.form.titreCreation"
    [sousTitre]="sousTitre()"
    [badgeTexte]="t.poste.form.badgeType[type()]"
    [badgeTon]="badgeTon()"
    [etapes]="etapesParcours()"
    [etapeCourante]="etapeCourante()"
    [lignes]="lignesFiche()"
    [ficheTitre]="ficheTitre()"
    [ficheSousTitre]="ficheCategorie()"
    [impactPrincipal]="impactPrincipal()"
    [impactSecondaire]="impactSecondaire()"
    [modeEdition]="modeEdition()"
    [peutAllerFin]="peutAllerFin()"
    [enregistrementEnCours]="enregistrementEnCours()"
    [avecEnregistrerEtNouveau]="true"
    (precedent)="precedent()"
    (suivant)="suivant()"
    (allerFin)="allerALaFin()"
    (naviguerFiche)="naviguerDepuisFiche($any($event))"
    (enregistrer)="enregistrer()"
    (enregistrerEtNouveau)="enregistrer(true)"
    (fermer)="fermer()"
    (ouvert)="onDialogShow()"
>
    @switch (etapeCourante()) {
        @case ('quoi') {
            <app-etape-quoi
                [form]="form"
                [categories]="categories()"
                [categorieId]="valeurs().categorieId ?? null"
            />
        }
        @case ('combien') {
            <app-etape-combien
                [form]="form"
                [valeurs]="valeurs()"
                [devises]="devisesDisponibles()"
                [periodicitesAutres]="periodiciteOptionsAutre"
            />
        }
        @case ('validite') {
            <app-etape-validite
                [form]="form"
                [valeurs]="valeurs()"
                [locale]="locale()"
                [aujourdHui]="aujourdHui()"
                [apercu]="apercuPoste()"
                [entete]="apercuEntete()"
                [legende]="apercuLegende()"
            />
        }
        @case ('paiement') {
            <app-etape-paiement
                [form]="form"
                [valeurs]="valeurs()"
                [type]="type()"
                [locale]="locale()"
                [apercu]="apercuPoste()"
                [entete]="apercuEntete()"
                [legende]="apercuLegende()"
            />
        }
        @case ('repartition') {
            <app-etape-repartition
                [form]="form"
                [valeurs]="valeurs()"
                [membres]="membresActifs()"
                [comptes]="comptes()"
                [partsAuto]="partsAuto()"
                [type]="type()"
                [erreur]="erreurRepartition()"
                [repartition]="repartitionSaisie()"
                (repartitionChange)="appliquerRepartition($event)"
            />
        }
        @case ('analyse') {
            <app-etape-analyse [form]="form" [valeurs]="valeurs()" />
        }
    }
</app-parcours-guide>

<p-confirmdialog/>
