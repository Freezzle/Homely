<div class="metric-bar-wrap">
  @if (leadLabel()) {
    <div class="metric-bar-item metric-bar-item-lead">
      <span class="metric-bar-item-label">{{ leadLabel() }}</span>
      <span class="metric-bar-item-value">{{ leadValue() }}</span>
    </div>
  }

  <p-metergroup [value]="meterItems()" [max]="total()">
    <ng-template #label let-items>
      <ol class="metric-bar-label-list">
        @for (item of items; track item.label) {
          <li class="metric-bar-label-item">
            <span class="metric-bar-label-marker" [style.background]="item.color"></span>
            <span class="metric-bar-label-text">
              @if (displayMode() === 'montant') {
                {{ item.label }} ({{ item.value | montant: devise() }})
              } @else {
                {{ item.label }} ({{ percentLabel(item.value) }}%)
              }
            </span>
          </li>
        }
      </ol>
    </ng-template>
  </p-metergroup>
</div>
