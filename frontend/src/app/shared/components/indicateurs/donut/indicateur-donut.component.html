<div class="donut">
  <div class="donut__cercle" [style.width]="taille()" [style.height]="taille()">
    <svg
      class="donut__svg"
      viewBox="0 0 100 100"
      role="img"
      [attr.aria-label]="valeurCentrale() + (libelleCentral() ? ' ' + libelleCentral() : '')">
      <circle class="donut__piste" cx="50" cy="50" r="38" fill="none" stroke-width="14" />
      @for (arc of arcs(); track arc.index) {
        <circle
          class="donut__segment"
          [class.donut__segment--interactif]="interactif()"
          cx="50" cy="50" r="38"
          fill="none"
          stroke-width="14"
          pathLength="100"
          transform="rotate(-90 50 50)"
          [attr.stroke]="arc.couleur"
          [attr.stroke-dasharray]="arc.dasharray"
          [attr.stroke-dashoffset]="arc.dashoffset"
          [attr.aria-label]="arc.infobulle"
          [attr.role]="interactif() ? 'button' : 'img'"
          [attr.tabindex]="interactif() ? 0 : null"
          [pTooltip]="arc.infobulle"
          tooltipPosition="top"
          (click)="cliquer(arc.index)"
          (keydown.enter)="cliquer(arc.index)" />
      }
    </svg>

    <!-- Valeur centrale en HTML superposé plutôt qu'en <text> SVG : dans un viewBox, la
         taille de police s'exprime en unités utilisateur, elle serait donc mise à l'échelle
         avec le cercle (14px déclarés rendaient de 12 à 17px selon la largeur de la carte)
         et ne respecterait plus l'échelle `--app-donnee-*`. Le libellé est déjà porté par
         l'aria-label du SVG, ce bloc est donc masqué aux lecteurs d'écran. -->
    <div class="donut__centre" aria-hidden="true">
      <span class="donut__valeur">{{ valeurCentrale() }}</span>
      @if (libelleCentral()) {
        <span class="donut__libelle-central">{{ libelleCentral() }}</span>
      }
    </div>
  </div>

  <ul class="donut__legende">
    @for (arc of arcs(); track arc.index) {
      <li
        class="donut__entree"
        [class.donut__entree--interactive]="interactif()"
        [attr.role]="interactif() ? 'button' : null"
        [attr.tabindex]="interactif() ? 0 : null"
        [pTooltip]="arc.infobulle"
        tooltipPosition="top"
        (click)="cliquer(arc.index)"
        (keydown.enter)="cliquer(arc.index)">
        <span class="donut__pastille" [style.background]="arc.couleur" aria-hidden="true"></span>
        <span class="donut__entree-libelle">{{ arc.libelle }}</span>
        <span class="donut__entree-valeur">{{ arc.valeur / 100 | pct }}</span>
      </li>
    }
  </ul>
</div>
