<div class="niveau">
  <p class="niveau__titre" [style.color]="couleur()">
    {{ libelle() }}<span class="niveau__ratio">{{ ratio() }}</span>
  </p>
  <div class="niveau__echelle" role="img" [attr.aria-label]="libelle() + ' ' + ratio()">
    @for (segment of segments(); track segment.index) {
      <span
        class="niveau__segment"
        [class.niveau__segment--actif]="segment.actif"
        [style.background]="segment.actif ? segment.couleur : null"></span>
    }
  </div>
  <div class="niveau__bornes">
    <span>{{ libelleDebut() }}</span>
    <span>{{ libelleFin() }}</span>
  </div>
</div>
